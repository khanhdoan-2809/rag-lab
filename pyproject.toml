[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-rag-lab"
version = "0.1.0"
description = "Learn document intelligence and RAG from first principles, one milestone at a time."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
tokens = ["tiktoken>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["rag_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
